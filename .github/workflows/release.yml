name: Release

# 推送 v* 形式的 tag 即自动完成全链路:
#   跑测试 -> 打包 exe -> 创建/更新 Release -> 上传资产 -> 写入 SHA256
# 测试失败会阻断发布, 避免把坏版本推给用户。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag (如 v4.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # 本项目是 Windows 专用工具(需要 tkinter), 必须在 Windows 上构建
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          # 统一为 vX.Y.Z 形式
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          # GITHUB_OUTPUT 只接受 key=value 逐行格式, 不接受 JSON
          # (写成 ConvertTo-Json 会报 Invalid format)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "版本号: $tag"

      - name: 语法检查
        run: python -X utf8 -m py_compile app.py tools.py tooldata.py

      - name: 运行单元测试
        run: python -X utf8 -m unittest discover -s tests -v

      - name: 校验工具库
        run: python -X utf8 tooldata.py

      - name: 安装构建依赖
        # 必须同时装 pillow: 它是液态玻璃界面的渲染依赖。
        # 曾因只装 pyinstaller 导致产物缺 Pillow(11MB 而非 33MB),
        # 玻璃特效静默失效 —— 故下面还有一道产物校验。
        run: |
          python -m pip install --upgrade "pyinstaller==6.11.1" "pillow>=10,<12"

      - name: 打包 exe
        # 用 spec 文件而非命令行参数: spec 里显式声明了
        # PIL.ImageTk 等 hiddenimports(它们是函数内延迟导入,
        # 静态分析抓不到), 保证玻璃渲染模块被完整打包
        run: |
          # 注意: PyInstaller 以 **spec 文件名** 作为产物文件名,
          # 而非 EXE 里的 name 字段, 故产物仍为中文名
          python -X utf8 -m PyInstaller "编程工具下载器.spec"

      - name: 校验产物
        id: artifact
        shell: pwsh
        run: |
          $exe = "dist\编程工具下载器.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Error "未生成 $exe"
            Get-ChildItem dist -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  dist: $($_.Name)" }
            exit 1
          }
          $size = (Get-Item -LiteralPath $exe).Length
          $sha  = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Host "产物: $exe ($size 字节)"
          Write-Host "SHA256: $sha"
          # 缺 Pillow 时产物约 11MB, 完整约 33MB
          if ($size -lt 20MB) {
            Write-Error ("产物仅 {0:N2} MB, 疑似未打包 Pillow —— " +
                         "玻璃特效会失效" -f ($size / 1MB))
            exit 1
          }
          "size=$size" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$sha"   | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 校验 Pillow 渲染模块已内嵌
        run: |
          python -X utf8 -c "import pathlib,glob;f=glob.glob(r'dist\*.exe');assert f,'dist 下无 exe';print('检查',f[0]);d=pathlib.Path(f[0]).read_bytes();m=['PIL.Image','PIL.ImageTk','PIL.ImageDraw','PIL.ImageFilter','PIL.ImageChops'];miss=[x for x in m if x.encode() not in d];print('Pillow 模块缺失:',miss) if miss else print('Pillow 模块完整');raise SystemExit(1 if miss else 0)"

      - name: 创建或更新 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $sha = "${{ steps.artifact.outputs.sha }}"
          $size = "${{ steps.artifact.outputs.size }}"
          $sizeMB = [math]::Round($size / 1MB, 2)

          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          # 用单引号 here-string: 双引号会吃掉三反引号, 破坏代码块渲染
          $notes = @'
          Windows 编程工具一键下载与静默部署工具。

          **下载附件 `Programming-Tools-Downloader.exe` 双击即可运行。**

          - 体积: __SIZE__ MB
          - 依赖: 无(仅 Windows 自带 curl.exe 作为下载回退)

          > 首次运行防火墙可能询问网络权限 —— 程序需要联网下载。

          完整变更日志见仓库 CHANGELOG.md。
          '@
          $notes = $notes -replace '__SIZE__', $sizeMB
          # 幂等追加 SHA256(重跑时先去掉旧行)
          # 幂等: 重跑时先清掉旧围栏与旧 SHA256 行, 否则会残留孤立的 ```
          # (只删 SHA256 行会留下空的代码块, 渲染成多个空围栏)
          $fence = ([string][char]96) * 3
          $notes = ($notes -split "`n" |
                    Where-Object { $_ -notmatch '^SHA256:' -and
                                   $_.Trim() -ne $fence -and
                                   $_.Trim() -ne "${fence}text" }) -join "`n"
          $notes = $notes.TrimEnd() + "`n`n${fence}text`nSHA256: $sha`n${fence}`n"
          $notes | Out-File -FilePath $notesFile -Encoding utf8

          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { Write-Error "创建 Release 失败"; exit 1 }
          } else {
            gh release edit $tag --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { Write-Error "更新 Release 失败"; exit 1 }
          }

      - name: 上传资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" `
            "dist\编程工具下载器.exe" --clobber
          # 退出码必须立即检查, 否则被后续命令覆盖造成假绿
          if ($LASTEXITCODE -ne 0) { Write-Error "上传失败"; exit 1 }
          Write-Host "上传成功"

      - name: 上验证结果
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" --json assets,body
          if ($LASTEXITCODE -ne 0) { Write-Error "验证失败"; exit 1 }
