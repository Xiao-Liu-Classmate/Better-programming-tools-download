name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限: 只需读取仓库内容
permissions:
  contents: read

jobs:
  test:
    # 本项目为 Windows 专用工具(PySide6 GUI + 静默安装),
    # 选择 windows runner 以获得原生 Qt 平台插件与一致环境
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -X utf8 -m pip install -r requirements.txt

      - name: 语法检查
        run: |
          python -X utf8 -m py_compile app.py ui_qt.py ui_bind.py check_qt_runtime.py tools.py tooldata.py tests/test_app.py tests/selfcheck.py tests/smoke_ui.py
          echo "语法检查通过"

      - name: 运行单元测试
        # 无头环境必须指定 offscreen 平台插件, 否则 Qt 无法初始化
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X utf8 -m unittest discover -s tests -v

      - name: 校验内置工具数据完整性
        run: python -X utf8 tooldata.py

      - name: 界面集成冒烟测试
        # 单元测试不建窗口, 覆盖不到控件 API 误用。迁移期曾因 ttk
        # 方法残留(pack_forget / configure(text=) / progress.start)
        # 导致下载流程运行时崩溃, 而 CI 仍全绿 —— 故单独跑此脚本。
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X utf8 tests/smoke_ui.py

  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 代码卫生检查(仅标准库, 无需联网安装)
        run: python -X utf8 -m tests.selfcheck